[package]
name = "fi-focus"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
name = "fi_focus_lib"
crate-type = ["cdylib", "rlib"]
[dependencies]
cpal = "0.18.2"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "accessibility"] }
[target.'cfg(windows)'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-winit", "renderer-skia"] }
windows-sys = { version = "0.61", features = ["Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
slint = { version = "=1.18.1", default-features = false, features = ["backend-android-activity-06"] }
[build-dependencies]
slint-build = "=1.18.1"
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
